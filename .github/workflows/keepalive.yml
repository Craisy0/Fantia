name: Keep Gottabet awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site to prevent Render free-tier spin-down
        run: curl -sS -o /dev/null -m 20 -w "HTTP %{http_code}\n" https://gottabet.onrender.com/ || true
